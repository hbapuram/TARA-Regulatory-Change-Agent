name: TARA quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -r demo/requirements.txt
      - name: Python tests
        run: pytest -q
      - name: Browser script syntax
        run: node --check demo/app.js
      - name: Public-release dry run
        run: python tools/build_public_release.py --output /tmp/tara-public-release
