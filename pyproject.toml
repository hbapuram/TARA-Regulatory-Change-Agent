[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tara"
version = "0.1.0"
description = "TARA — Regulatory Change to Action. A prototype for source-governed, case-specific compliance workflows."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=1.50", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
include = ["tara*"]

[project.scripts]
tara = "tara.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
