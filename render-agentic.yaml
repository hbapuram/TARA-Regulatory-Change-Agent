# Separate Render blueprint for the isolated TARA Agentic Demo.
# This service does not alter or share the existing tara-demo deployment.
services:
  - type: web
    name: tara-agentic-demo
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt -r agentic_demo/requirements.txt && pip install --no-deps -e .
    startCommand: python -m uvicorn agentic_demo.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TARA_LLM_MODEL
        value: "gpt-5-mini"
      - key: TARA_LLM_MAX_TURNS
        value: "12"
      # This no-secret relay forwards only unchanged checked-in synthetic
      # profiles to the already controlled AI/MCP demo service. It never
      # forwards browser-edited cases or an API key.
      - key: TARA_AGENT_RELAY_URL
        value: "https://tara-demo.onrender.com"
      # Optional: set OPENAI_API_KEY as a secret here for a fully independent
      # agent. It is never sent to the browser or MCP subprocess.
